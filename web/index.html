<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0e1b2c">
  <title>CarePlan | Smart Healthcare PM</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#" data-page="dashboard" aria-label="CarePlan home">
        <span class="brand-symbol"><span></span><span></span><span></span><span></span></span>
        <span class="brand-copy"><strong>care<span>plan</span></strong><small>HEALTHCARE PROJECTS</small></span>
      </a>
      <div class="workspace-switch"><span class="workspace-icon">✚</span><span><small>WORKSPACE</small><strong>Hospital Network</strong></span><span class="chevron">⌄</span></div>
      <div class="nav-label">WORKSPACE</div>
      <nav class="nav-list" aria-label="Main navigation">
        <button class="nav-item active" data-page="dashboard"><span class="nav-icon" data-icon="grid"></span><span>Overview</span></button>
        <button class="nav-item" data-page="charter"><span class="nav-icon" data-icon="briefcase"></span><span>Project charter</span></button>
        <button class="nav-item" data-page="scope"><span class="nav-icon" data-icon="layers"></span><span>Scope &amp; requirements</span></button>
        <button class="nav-item" data-page="wbs"><span class="nav-icon" data-icon="tree"></span><span>Work breakdown</span></button>
        <button class="nav-item" data-page="schedule"><span class="nav-icon" data-icon="calendar"></span><span>Schedule</span><span class="nav-count" id="delay-count">0</span></button>
        <button class="nav-item" data-page="resources"><span class="nav-icon" data-icon="users"></span><span>Team &amp; resources</span></button>
        <button class="nav-item" data-page="cost"><span class="nav-icon" data-icon="wallet"></span><span>Cost management</span></button>
        <button class="nav-item" data-page="evm"><span class="nav-icon" data-icon="chart"></span><span>Earned value</span></button>
        <button class="nav-item" data-page="quality"><span class="nav-icon" data-icon="shield"></span><span>Quality &amp; defects</span><span class="nav-count alert" id="defect-count">0</span></button>
        <button class="nav-item" data-page="risks"><span class="nav-icon" data-icon="triangle"></span><span>Risk register</span></button>
        <button class="nav-item" data-page="changes"><span class="nav-icon" data-icon="arrows"></span><span>Change requests</span><span class="nav-count" id="change-count">0</span></button>
        <button class="nav-item" data-page="reports"><span class="nav-icon" data-icon="file"></span><span>Reports</span></button>
      </nav>
      <div class="sidebar-bottom">
        <div class="help-card"><span class="help-orb">✦</span><strong>Need a hand?</strong><small>Your project data is saved locally and securely.</small><button data-page="reports">View project reports <span>↗</span></button></div>
        <button class="profile-switch" id="profile-button"><span class="avatar">MA</span><span><strong>M Ahmad</strong><small>Project Manager</small></span><span class="chevron">···</span></button>
      </div>
    </aside>

    <div class="main-shell">
      <header class="topbar">
        <button class="icon-button mobile-menu" id="mobile-menu" aria-label="Toggle navigation">☰</button>
        <div class="breadcrumbs"><span>Projects</span><span class="crumb-sep">/</span><strong id="breadcrumb-title">Overview</strong><span class="top-project-name" id="top-project-name"></span><span id="top-project-status"></span></div>
        <div class="topbar-right">
          <span class="saved-indicator"><i></i> All changes saved</span>
          <button class="icon-button" id="refresh-button" title="Refresh project data" aria-label="Refresh">↻</button>
          <button class="icon-button notification-button" id="notification-button" title="Project alerts" aria-label="Project alerts">♧<i></i></button>
          <button class="icon-button" id="settings-button" title="Workspace settings" aria-label="Workspace settings">⚙</button>
          <span class="top-divider"></span><span class="avatar top-avatar">MA</span>
        </div>
      </header>
      <main id="main-content" class="content-area" tabindex="-1"></main>
      <footer class="footer"><span>CarePlan <b>•</b> Healthcare project operations</span><span id="last-updated">Local workspace</span></footer>
    </div>
  </div>

  <dialog id="modal" class="modal">
    <form method="dialog" class="modal-card" id="modal-form">
      <div class="modal-heading"><div><span class="eyebrow">PROJECT WORKSPACE</span><h2 id="modal-title">Add record</h2></div><button class="icon-button close-modal" type="button" value="cancel" aria-label="Close">×</button></div>
      <div id="modal-fields" class="modal-fields"></div>
      <div class="modal-actions"><button class="button button-quiet" type="button" value="cancel">Cancel</button><button class="button button-primary" id="modal-submit" value="default">Save changes <span>→</span></button></div>
    </form>
  </dialog>
  <div id="toast-region" class="toast-region" aria-live="polite"></div>
</body>
</html>
